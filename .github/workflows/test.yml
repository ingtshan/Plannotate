name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
      - name: JavaScript tests
        run: node --test extension/tests/*.test.js
      - name: JavaScript syntax
        run: find extension -name '*.js' -exec node --check {} \;
      - name: Build extension
        run: python3 scripts/build_extension.py
      - name: Verify extension archive
        run: cd dist && sha256sum -c SHA256SUMS.txt
