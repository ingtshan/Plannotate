<!doctype html>
<meta charset="utf-8">
<title>Plannotate</title>
<link rel="stylesheet" href="viewer.css">
<div class="viewer-shell">
  <header class="viewer-header">
    <div>
      <h1>Plannotate</h1>
      <a id="pr-link" target="_blank" rel="noreferrer"></a>
    </div>
    <div class="viewer-controls">
      <label>Plan <select id="plan-select" disabled></select></label>
      <label>版本 <select id="version-select" disabled></select></label>
      <button id="refresh" type="button" disabled>刷新</button>
      <button id="general-comment" type="button" class="primary" disabled>＋ 总体意见</button>
      <button id="open-settings" type="button">设置</button>
      <button id="close-embedded" type="button" hidden>返回 PR</button>
    </div>
  </header>
  <p id="status" class="status" role="status">正在初始化…</p>
  <section id="auth-panel" class="auth-panel" hidden>
    <h2 id="auth-title">需要 GitHub token</h2>
    <p id="auth-message">请配置用于当前仓库的 fine-grained token。</p>
    <ul id="auth-steps"></ul>
    <div class="auth-actions">
      <a id="auth-create-token" class="button-link" target="_blank" rel="noreferrer">在 GitHub 创建正确权限的 token</a>
      <button id="auth-settings" type="button" class="primary">打开设置并检查</button>
    </div>
  </section>
  <iframe id="sandbox" title="Plan rendered review" sandbox="allow-scripts"></iframe>
</div>
<script src="protocol.js"></script>
<script src="github.js"></script>
<script src="viewer.js"></script>
